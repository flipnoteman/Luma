name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The long fuzz run, nightly.
    - cron: "0 3 * * *"

env:
  LUMA_DEVICE: cpu

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caches ~/.cargo and target/ (dependencies only, not the workspace crate), keyed on the
      # toolchain, Cargo.lock and the workflow; saved from main only, so PRs reuse it read-only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install software Vulkan (Mesa lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --release --locked
      - run: cargo test --doc --release --locked
      - name: Differential fuzzer
        run: "cargo test --release --locked fuzz::"
        env:
          LUMA_FUZZ_CASES: 200
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restores the test job's cache (a superset of what this job builds) without saving over it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - name: Install software Vulkan (Mesa lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Differential fuzzer, long run
        run: "cargo test --release --locked fuzz:: -- --nocapture"
        env:
          LUMA_FUZZ_CASES: 5000
      - name: Keep the shrunk failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: tests/proptest-regressions/
