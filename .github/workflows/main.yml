name: Publish to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Check release tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
          
      - name: Install software Vulkan driver (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
        
      - name: Run tests
        run: cargo test --all-features

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
