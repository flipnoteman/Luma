[package]
name = "luma"
version.workspace = true
edition.workspace = true
description = "Lazy GPU arrays for Rust on wgpu (Vulkan, Metal, DX12): fused elementwise kernels, reductions, FFT convolution, custom WGSL kernels"
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/luma"
keywords = ["gpu", "wgpu", "array", "math", "compute"]
categories = ["science", "mathematics", "concurrency"]
rust-version.workspace = true
exclude = [".github/", "benchmarks/"]

[workspace]
members = ["luma-derive"]
exclude = ["benchmarks/arrayfire"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flipnoteman/Luma"
rust-version = "1.99"

[dependencies]
wgpu = { version = "30", features = ["naga-ir"] }
bytemuck = "1.21.0"
log = "0.4.25"
pollster = "1.0.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }
encase = "0.13.0"
luma-derive = { version = "=0.3.0", path = "luma-derive" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
ml-kem = "0.3.4"
proptest = "1"
rustfft = "6"

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "ml"
harness = false

[[bench]]
name = "monte_carlo"
harness = false

[[bench]]
name = "imaging"
harness = false
