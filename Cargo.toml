[package]
name = "luma"
version = "0.2.4"
edition = "2024"
description = "Lazy GPU arrays for Rust on wgpu (Vulkan, Metal, DX12): fused elementwise kernels, reductions, FFT convolution, custom WGSL kernels"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/flipnoteman/Luma"
documentation = "https://docs.rs/luma"
keywords = ["gpu", "wgpu", "array", "math", "compute"]
categories = ["science", "mathematics", "concurrency"]
rust-version = "1.99"
exclude = [".github/", "benchmarks/"]

[dependencies]
wgpu = "30"
bytemuck = "1.21.0"
log = "0.4.25"
pollster = "1.0.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }
encase = "0.13.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
rustfft = "6"

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "ml"
harness = false

[[bench]]
name = "monte_carlo"
harness = false

[[bench]]
name = "imaging"
harness = false
